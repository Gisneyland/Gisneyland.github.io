<aside id="site-editor" class="site-editor site-editor-command-bar notranslate" translate="no" aria-label="網站編輯操作" hidden>
  <label class="sr-only" for="site-editor-page">切換頁面（自動儲存草稿）</label>
  <select id="site-editor-page" aria-label="切換頁面（自動儲存草稿）">
    {% assign editor_pages = site.pages | sort: 'url' %}
    {% for editor_page in editor_pages %}
    {% if editor_page.layout == 'default' and editor_page.url != '/admin/' %}
    <option value="{{ editor_page.url | relative_url }}">{{ editor_page.title | escape }}</option>
    {% endif %}
    {% endfor %}
  </select>
  <div class="site-editor-actions">
    <button type="button" id="site-editor-save" title="只儲存私人草稿"><span class="material-icons" aria-hidden="true">save</span>儲存</button>
    <button type="button" id="site-editor-preview" title="儲存並預覽，訪客不會看到草稿"><span class="material-icons" aria-hidden="true">visibility</span>預覽</button>
    <button type="button" id="site-editor-publish" title="發布已儲存的目前頁面與全站導覽"><span class="material-icons" aria-hidden="true">publish</span>發布</button>
    <button type="button" id="site-editor-reset" title="重新讀取目前已發布的頁面與全站導覽，還原私人草稿">還原已發布</button>
    <button type="button" id="site-editor-close" title="結束編輯，返回已發布網站" aria-label="結束編輯"><span class="material-icons" aria-hidden="true">close</span></button>
  </div>
  <p class="site-editor-hint">點文字或元件編輯 · 點導覽修改 · ＋ 新增。勿輸入個資；儲存不會發布。</p>
  <p id="site-editor-status" role="status" aria-live="polite"></p>
</aside>
<section id="site-editor-nav" class="site-editor-inline-ui site-editor-nav notranslate" translate="no" aria-label="就地編輯全站導覽" hidden>
  <div class="site-editor-nav-actions">
    <button type="button" id="site-editor-nav-main" aria-pressed="true">主要導覽</button>
    <button type="button" id="site-editor-nav-more" aria-pressed="false">更多導覽</button>
    <button type="button" id="site-editor-nav-add" aria-label="新增導覽項目">＋ 新增</button>
    <button type="button" id="site-editor-nav-close" aria-label="收起導覽編輯">×</button>
  </div>
  <p id="site-editor-nav-hint">點選下方導覽連結修改，或新增項目。</p>
  <form id="site-editor-nav-form" hidden>
    <label>顯示文字<input type="text" id="site-editor-nav-label" maxlength="100" required></label>
    <label>網址<input type="text" id="site-editor-nav-url" maxlength="2048" required></label>
    <label>Material 圖示名稱<input type="text" id="site-editor-nav-icon" maxlength="64" placeholder="例如 home；清空可移除圖示"></label>
    <label>Logo／圖片網址<input type="text" id="site-editor-nav-src" maxlength="2048" placeholder="https:// 或站內路徑；清空可移除圖片"></label>
    <label>圖片替代文字<input type="text" id="site-editor-nav-alt" maxlength="300"></label>
    <div class="site-editor-nav-actions">
      <button type="submit" id="site-editor-nav-apply">套用至草稿</button>
      <button type="button" id="site-editor-nav-up" aria-label="導覽項目上移">←</button>
      <button type="button" id="site-editor-nav-down" aria-label="導覽項目下移">→</button>
      <button type="button" id="site-editor-nav-delete">刪除導覽項目</button>
    </div>
  </form>
</section>
<button type="button" id="site-editor-nav-toggle" class="site-editor-inline-ui site-editor-nav-toggle notranslate" translate="no" aria-label="編輯全站導覽" aria-controls="site-editor-nav" aria-expanded="false" hidden>導覽 ＋</button>
<p id="site-editor-mode-status" class="site-editor-mode-status notranslate" translate="no" role="status" aria-live="polite"></p>
<div id="site-editor-preview-toolbar" class="site-editor-preview-toolbar notranslate" translate="no" role="region" aria-label="草稿預覽工具" hidden>
  <span>管理員草稿預覽（未發布）</span>
  <button type="button" id="site-editor-reopen">重新開啟編輯器</button>
  <button type="button" id="site-editor-preview-leave">離開預覽</button>
</div>
