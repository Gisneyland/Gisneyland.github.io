<div class="card space-y-12">
    <div class="card-content">
      <h2 id="questionnaire-notice" class="card-title" data-i18n="notice_title" tabindex="-1">篩檢須知</h2>
        <span data-i18n="notice_paragraph">您好，<br>
            定期檢視自我健康，可以提升傳染疾病的預防知識並降低感染風險。快速篩檢結果若為陽性，將由篩檢人員協助轉介醫療服務。<br>
            所有篩檢資料皆保密，敬請放心，謝謝。<br>
            <label class="text-right">財團法人紅絲帶基金會</label></span>
      <div class="input-field question-step">
        <input type="text" name="nickname" id="nickname" maxlength="80" autocomplete="off">
        <label for="nickname" data-i18n="nickname">暱稱</label>
        <button type="button" class="btn-flat question-next" data-question-next>下一題</button>
      </div>
      <fieldset class="consent-options question-step" disabled>
        <legend class="sr-only">同意與確認事項</legend>
        <details open>
          <summary>個人資料與問卷資料使用說明</summary>
          <div class="privacy-copy" tabindex="0" aria-label="個人資料與問卷資料使用說明全文">
            <p>
              本問卷資料僅用於健康管理、篩檢服務與統計分析。資料會由授權的工作人員保管，並依組織的資料保存期限保存；如需查詢、更正或刪除資料，請向篩檢人員提出申請。
            </p>
            <span class="privacy-read-sentinel" aria-hidden="true"></span>
          </div>
        </details>
        <label>
          <input type="checkbox" name="agreement" required />
          <span>我同意並配合快速篩檢諮詢及陽性轉介服務，並已知悉篩檢試劑空窗期間可能測不到抗原或抗體。</span>
        </label>
        <label>
          <input type="checkbox" name="needle_consent" required />
          <span>我同意篩檢員以扎針採血的方式進行快速篩檢。</span>
        </label>
        <label>
          <input type="checkbox" name="privacy_consent" value="accepted" required />
          <span>我已閱讀並同意上述資料使用說明。</span>
        </label>
      </fieldset>
      <input type="hidden" name="privacy_notice_version" value="2026-09-23">
        <!-- <div class="input-field">
            <label for="frequency_screening">篩檢頻率</label> -->
            <div class="question-step frequency-question">
              <div class="frequency-heading">
                <label for="frequency_screening">篩檢頻率</label>
                <output class="frequency-screening-value" for="frequency_screening" aria-live="polite">偶爾篩檢</output>
              </div>
              <input type="range" id="frequency_screening" name="frequency_screening" min="-1" max="1" step="1" value="0" aria-valuetext="偶爾篩檢">
              <div class="frequency-labels text-sm mt-2">
                <span data-frequency-value="-1" data-i18n="frequency_screening_never">從未篩檢</span>
                <span data-frequency-value="0" data-i18n="frequency_screening_oftenly">偶爾篩檢</span>
                <span data-frequency-value="1" data-i18n="frequency_screening_regularly">定期篩檢</span>
              </div>
              <button type="button" class="btn-flat question-next" data-question-next>下一題</button>
         </div>
      <div class="input-field question-step" data-show-if="frequency_screening:0,1">
        <p>
        <input type="month" name="last_screening_at" id="last_screening_at">
        <label for="last_screening_at" data-i18n="last_screening">最近一次篩檢日期</label>
        </p>
        <button type="button" class="btn-flat question-next" data-question-next>下一題</button>
      </div>
    </div>
  </div>
