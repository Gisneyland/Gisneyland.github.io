        <script>
      const selectGender = document.getElementById('gender_select');
      const GenderOthersField = document.getElementById('gender_others_field');
    
      selectGender.addEventListener('change', function() {
        if (this.value === 'gender_others') {
          GenderOthersField.classList.remove('hidden');
          // 先強制 reflow 讓 transition 生效
          void GenderOthersField.offsetWidth;
          GenderOthersField.classList.add('opacity-100');
          GenderOthersField.classList.remove('opacity-0');
        } else {
          GenderOthersField.classList.add('opacity-0');
          GenderOthersField.classList.remove('opacity-100');
          // 等動畫結束再隱藏
          setTimeout(() => {
            GenderOthersField.classList.add('hidden');
          }, 500);
        }
      });
    </script>
