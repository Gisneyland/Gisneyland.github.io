  <!-- 居住地 -->
    <div class="card-content">
        <div class="input-field col s12">
            <select id="residence_select" name="residence">
              <option value="" disabled selected>居住地</option>
              <option value="hsinchu_city" data-i18n="hsinchu_city">新竹市</option>
              <option value="hsinchu_county" data-i18n="hsinchu_county">新竹縣</option>

        </div>    
      <!-- 其他輸入（預設隱藏，含暗色模式） -->

        <script>
      const selectGender = document.getElementById('gender_select');
      const othersField = document.getElementById('gender_others_field');
    
      selectGender.addEventListener('change', function() {
        if (this.value === 'gender_others') {
          othersField.classList.remove('hidden');
          // 先強制 reflow 讓 transition 生效
          void othersField.offsetWidth;
          othersField.classList.add('opacity-100');
          othersField.classList.remove('opacity-0');
        } else {
          othersField.classList.add('opacity-0');
          othersField.classList.remove('opacity-100');
          // 等動畫結束再隱藏
          setTimeout(() => {
            othersField.classList.add('hidden');
          }, 500);
        }
      });
    </script>
