<div class="card">
    <span class="card-title" data-i18n="profile_title">基本資料</span>
    <p class="text-right">衛生福利部疾病管制署計畫</p>
    
    <!-- 性別 -->
    <div class="card-content">
      <span class="card-title" data-i18n="gender">性別</span>
      <p>
        <label><input type="radio" name="gender" /><span data-i18n="cisman">順性別男性</span></label>
        <label><input type="radio" name="gender" /><span data-i18n="ciswoman">順性別女性</span></label>
        <label><input type="radio" name="gender" /><span data-i18n="transman">跨性別男性</span></label>
        <label><input type="radio" name="gender" /><span data-i18n="transwoman">跨性別女性</span></label>
        <label><input type="radio" name="gender" /><span data-i18n="nonbinary">非二元性別</span></label>
          <div class="input-field">
            <input type="text" name="gender" id="gender">
            <label for="gender" data-i18n="gender_others">其他</label>
          </div>
      </p>
    </div>

  <!-- 性傾向 -->
    <div class="card-content">
      <span class="card-title" data-i18n="orientation">性傾向</span>
      <p>
        <label><input type="radio" name="orientation" /><span data-i18n="heterosexual">異性戀</span></label>
        <label><input type="radio" name="orientation" /><span data-i18n="homosexual">同性戀</span></label>
        <label><input type="radio" name="orientation" /><span data-i18n="bisexual">雙性戀</span></label>
        <label><input type="radio" name="orientation" /><span data-i18n="orientation_others">其他</span></label>
          <div class="input-field">
            <input type="text" name="orientation" id="orientation">
            <label for="orientation" data-i18n="orientation_others">其他</label>
          </div>
      </p>
    </div>

  <!-- 教育程度 -->
    <div class="card-content">
      <span class="card-title" data-i18n="education">教育程度</span>
      <p>
        <label><input type="radio" name="education" /><span data-i18n="illiterate">小學以下</span></label>
        <label><input type="radio" name="education" /><span data-i18n="primary">小學</span></label>
        <label><input type="radio" name="education" /><span data-i18n="junior_high">國中</span></label>
        <label><input type="radio" name="education" /><span data-i18n="senior_high">高中</span></label>
        <label><input type="radio" name="education" /><span data-i18n="university">大學</span></label>
        <label><input type="radio" name="education" /><span data-i18n="master">碩士</span></label>
        <label><input type="radio" name="education" /><span data-i18n="phd">博士以上</span></label>
      </p>
    </div>

  <!-- 居住地 -->
    <div class="card-content">
      <span class="card-title" data-i18n="residence">居住地</span>
    
      <!-- 下拉選單 -->
      <div class="input-field">
        <label for="residence_select" data-i18n="residence">居住地</label>
        <select id="residence_select" name="residence"
                class="border rounded p-2 w-full bg-white dark:bg-gray-800 dark:text-gray-100">
          <option value="hsinchu_city" data-i18n="hsinchu_city">新竹市</option>
          <option value="hsinchu_county" data-i18n="hsinchu_county">新竹縣</option>
          <option value="miaoli_county" data-i18n="miaoli_county">苗栗縣</option>
          <option value="taoyuan_city" data-i18n="taoyuan_city">桃園市</option>
          <option value="others" data-i18n="residence_others">其他</option>
        </select>
      </div>
    
      <!-- 其他輸入（預設隱藏，含暗色模式） -->
      <div id="residence_other_field"
           class="input-field transition-opacity duration-500 ease-in-out opacity-0 hidden">
        <label for="residence_other" data-i18n="residence_others">其他</label>
        <input type="text" name="residence_other" id="residence_other"
               class="border rounded p-2 w-full bg-white dark:bg-gray-800 dark:text-gray-100">
      </div>
    </div>
    
    <script>
      const selectResidence = document.getElementById('residence_select');
      const otherField = document.getElementById('residence_other_field');
    
      selectResidence.addEventListener('change', function() {
        if (this.value === 'others') {
          otherField.classList.remove('hidden');
          // 先強制 reflow 讓 transition 生效
          void otherField.offsetWidth;
          otherField.classList.add('opacity-100');
          otherField.classList.remove('opacity-0');
        } else {
          otherField.classList.add('opacity-0');
          otherField.classList.remove('opacity-100');
          // 等動畫結束再隱藏
          setTimeout(() => {
            otherField.classList.add('hidden');
          }, 500);
        }
      });
    </script>

  </div>
</div>
