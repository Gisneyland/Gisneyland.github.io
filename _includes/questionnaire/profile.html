<section class="card questionnaire-card">
  <div class="card-content">
    <h2 id="questionnaire-profile" class="card-title" data-i18n="profile_title" tabindex="-1">基本資料</h2>
    <p class="text-right">衛生福利部疾病管制署計畫</p>
  </div>

  <div class="profile-fields">
    <div class="question-step profile-question">
      <div class="input-field">
        <select id="gender_select" name="gender" required>
          <option value="" disabled selected>請選擇</option>
          <option value="cisman" data-i18n="cisman">順性別男性</option>
          <option value="transman" data-i18n="transman">跨性別男性</option>
          <option value="ciswoman" data-i18n="ciswoman">順性別女性</option>
          <option value="transwoman" data-i18n="transwoman">跨性別女性</option>
          <option value="gender_others" data-i18n="gender_others">其他</option>
        </select>
        <label for="gender_select" data-i18n="gender">性別</label>
      </div>
      <div id="gender_others_field" class="conditional-field" hidden>
        <label for="gender_others" data-i18n="gender_others">請填寫其他性別</label>
        <input type="text" name="gender_others" id="gender_others" autocomplete="off">
      </div>
    </div>

    <div class="question-step profile-question">
      <div class="input-field">
        <select id="orientation_select" name="orientation" required>
          <option value="" disabled selected>請選擇</option>
          <option value="heterosexual" data-i18n="heterosexual">異性戀</option>
          <option value="homosexual" data-i18n="homosexual">同性戀</option>
          <option value="bisexual" data-i18n="bisexual">雙性戀</option>
          <option value="orientation_others" data-i18n="orientation_others">其他</option>
        </select>
        <label for="orientation_select" data-i18n="orientation">性傾向</label>
      </div>
      <div id="orientation_others_field" class="conditional-field" hidden>
        <label for="orientation_others" data-i18n="orientation_others">請填寫其他性傾向</label>
        <input type="text" name="orientation_others" id="orientation_others" autocomplete="off">
      </div>
    </div>

    <div class="question-step profile-question">
      <label for="birth">出生年份</label>
      <select id="birth" name="birth" required>
        <option value="" disabled selected>請選擇年份</option>
      </select>
    </div>

    <div class="question-step profile-question nationality-question">
      <label for="nationality-search">國籍（可複選）</label>
      <input type="search" id="nationality-search" autocomplete="off" aria-controls="nationality-options" placeholder="輸入國家或地區搜尋">
      <p class="field-hint">部分國家限制雙重國籍，選擇這類國籍時此欄會改為單選。各地規定可能因個人情況不同，請以當地法規為準。</p>
      <div id="nationality-selected" class="selected-values" aria-live="polite"></div>
      <div id="nationality-options" class="search-options" role="group" aria-label="國籍選項" data-required-group="nationality"></div>
      <p id="nationality-message" class="field-hint" aria-live="polite"></p>
      <button type="button" class="btn-flat question-next" data-question-next>下一題</button>
    </div>

    <div class="question-step profile-question">
      <label for="hometown">成年前居住地</label>
      <input type="search" id="hometown" name="hometown" list="taiwan-admin-options" autocomplete="off" required placeholder="搜尋縣市">
      <div id="hometown-others-field" class="conditional-field" hidden>
        <label for="hometown_others">請填寫其他居住地</label>
        <input type="text" id="hometown_others" name="hometown_others" autocomplete="off">
      </div>
    </div>

    <div class="question-step profile-question">
      <label for="residence">目前居住地</label>
      <input type="search" id="residence" name="residence" list="taiwan-admin-options" autocomplete="off" required placeholder="搜尋縣市">
      <div id="residence-others-field" class="conditional-field" hidden>
        <label for="residence_others">請填寫其他居住地</label>
        <input type="text" id="residence_others" name="residence_others" autocomplete="off">
      </div>
    </div>

    <div class="question-step profile-question">
      <div class="input-field">
        <select id="education" name="education" required>
          <option value="" disabled selected>請選擇</option>
          <option value="illiterate" data-i18n="illiterate">不識字</option>
          <option value="primary" data-i18n="primary">小學</option>
          <option value="junior_high" data-i18n="junior_high">國中</option>
          <option value="senior_high" data-i18n="senior_high">高中</option>
          <option value="university" data-i18n="university">大學</option>
          <option value="master" data-i18n="master">碩士</option>
          <option value="phd" data-i18n="phd">博士</option>
        </select>
        <label for="education">教育程度</label>
      </div>
    </div>
  </div>

  <datalist id="taiwan-admin-options"></datalist>
  <div class="profile-review question-step">
    <button type="button" id="profile-review-button" class="btn">確認基本資料</button>
  </div>
  <p id="profile-review-message" class="profile-review-message" hidden>以上是您這次的填答，請維持在這個頁面，稍後將問卷交給篩檢員完成後續確認。</p>
</section>
