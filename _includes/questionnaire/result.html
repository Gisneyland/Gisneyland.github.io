<div class="card">
    <div class="card-content">
      <span class="card-title" data-i18n="screening">篩檢結果</span>
      <p>此區域由篩檢員填答</p>

        <div class="row">
            
            <div class="col s4">
                <div class="input-field">
                <input type="text" name="screener" id="screener">
                <label for="screener" data-i18n="screener">篩檢員編號</label>
              </div>
            </div>
        
            <div class="col s4">
              <div class="input-field">
                <input type="date" name="screening_at" id="screening_at">
                <label for="screening_at" data-i18n="screening_date">篩檢日期</label>
              </div>
            </div>
        
            <div class="col s4">
              <div class="input-field">
                <input type="text" name="screening_place" id="screening_place">
                <label for="screening_place" data-i18n="screening_place">篩檢地點</label>
              </div>
            </div>
        
            <div class="col s4">
              <div class="input-field col s12">
                <select multiple>
                  <option value="hiv_positive" data-i18n="hiv_positive">HIV 陽性</option>
                  <option value="hiv_negative" data-i18n="hiv_negative">HIV 陰性</option>
                    <option value="syphilis_positive" data-i18n="syphilis_positive">梅毒陽性</option> 
                    <option value="syphilis_negative" data-i18n="syphilis_negative">梅毒陰性</option>
                </select>
                <label>篩檢判讀</label>
              </div>
            </div>  
        </div>
    </div>
</div>
