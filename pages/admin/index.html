---
layout: admin
title: 問卷管理後台
permalink: /admin/
---

<section class="admin-shell" aria-labelledby="admin-title">
  <div class="admin-header">
    <div>
      <p class="eyebrow">GisneyLand 內部使用</p>
      <h1 id="admin-title">問卷管理後台</h1>
      <p class="admin-subtitle">僅供授權工作人員查看健康問卷資料。</p>
    </div>
    <button id="sign-out-button" class="admin-button secondary" type="button" hidden>
      <span class="material-icons notranslate" translate="no" aria-hidden="true">logout</span>
      登出
    </button>
  </div>

  <section id="admin-login" class="admin-panel" aria-labelledby="login-title">
    <h2 id="login-title">管理員登入</h2>
    <p>已核准的工作人員可登入；新帳號申請需由管理員審核後才能查看資料。</p>
    <form id="login-form" class="admin-form">
      <label for="admin-email">電子郵件</label>
      <input id="admin-email" name="email" type="email" autocomplete="username" required>
      <label for="admin-password">密碼</label>
      <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      <button class="admin-button" type="submit">
        <span class="material-icons notranslate" translate="no" aria-hidden="true">login</span>
        登入後台
      </button>
    </form>
    <div class="admin-auth-links">
      <button id="show-signup" class="admin-button secondary" type="button">申請帳號</button>
      <button id="show-password-reset" class="admin-button secondary" type="button">忘記密碼</button>
    </div>
    <form id="signup-form" class="admin-form" hidden>
      <h3>申請管理員帳號</h3>
      <label for="signup-email">電子郵件</label>
      <input id="signup-email" name="email" type="email" autocomplete="email" required>
      <label for="signup-password">設定密碼</label>
      <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="signup-password-confirm">確認密碼</label>
      <input id="signup-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button class="admin-button" type="submit">送出帳號申請</button>
      <button class="admin-button secondary" type="button" data-back-to-login>返回登入</button>
    </form>
    <form id="password-reset-form" class="admin-form" hidden>
      <h3>重設密碼</h3>
      <label for="reset-email">電子郵件</label>
      <input id="reset-email" name="email" type="email" autocomplete="email" required>
      <button class="admin-button" type="submit">寄送重設連結</button>
      <button class="admin-button secondary" type="button" data-back-to-login>返回登入</button>
    </form>
    <form id="password-update-form" class="admin-form" hidden>
      <h3>設定新密碼</h3>
      <label for="new-password">新密碼</label>
      <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="new-password-confirm">確認新密碼</label>
      <input id="new-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button class="admin-button" type="submit">更新密碼</button>
    </form>
    <button id="back-from-password-update" class="admin-button secondary" type="button" hidden>返回登入</button>
    <p id="login-status" class="admin-status" role="status" hidden></p>
  </section>

  <section id="admin-dashboard" hidden>
    <div class="admin-toolbar">
      <div>
        <h2>問卷資料</h2>
        <p id="admin-user" class="admin-muted"></p>
      </div>
      <div class="admin-actions">
        <button id="refresh-button" class="admin-button secondary" type="button">
          <span class="material-icons notranslate" translate="no" aria-hidden="true">refresh</span>
          重新整理
        </button>
        <button id="export-button" class="admin-button secondary" type="button">
          <span class="material-icons notranslate" translate="no" aria-hidden="true">download</span>
          匯出目前結果
        </button>
      </div>
    </div>
    <div class="admin-stats" aria-label="問卷統計">
      <div class="stat-card"><span>目前載入</span><strong id="total-count">0</strong><small>筆問卷</small></div>
      <div class="stat-card"><span>繁體中文</span><strong id="zh-count">0</strong><small>筆</small></div>
      <div class="stat-card"><span>English</span><strong id="en-count">0</strong><small>筆</small></div>
      <div class="stat-card"><span>目前顯示</span><strong id="filtered-count">0</strong><small>筆</small></div>
    </div>
    <div class="admin-filters">
      <label for="search-responses">搜尋篩檢員、地點或暱稱</label>
      <input id="search-responses" type="search" placeholder="輸入關鍵字">
      <label for="language-filter">語言</label>
      <select id="language-filter">
        <option value="all">全部</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <p id="dashboard-status" class="admin-status" role="status" hidden></p>
    <div class="admin-table-wrap" role="region" aria-label="問卷提交紀錄表格，可左右捲動" tabindex="0">
      <table class="admin-table">
        <caption class="sr-only">健康問卷提交紀錄</caption>
        <thead>
          <tr>
            <th scope="col">送出時間</th>
            <th scope="col">暱稱</th>
            <th scope="col">篩檢員</th>
            <th scope="col">地點</th>
            <th scope="col">語言</th>
            <th scope="col"><span class="sr-only">操作</span></th>
          </tr>
        </thead>
        <tbody id="responses-body"></tbody>
      </table>
    </div>
    <p id="empty-state" class="admin-empty" hidden>目前沒有符合條件的資料。</p>
    <div class="admin-pagination" aria-label="問卷分頁">
      <button id="previous-page" class="admin-button secondary" type="button">上一頁</button>
      <span id="page-status">第 1 頁</span>
      <button id="next-page" class="admin-button secondary" type="button">下一頁</button>
    </div>
  </section>
</section>

<dialog id="response-dialog" class="response-dialog" aria-labelledby="response-dialog-title">
  <div class="dialog-header">
    <h2 id="response-dialog-title">問卷詳細資料</h2>
    <button id="close-dialog-button" class="icon-button" type="button" aria-label="關閉詳細資料">
      <span class="material-icons notranslate" translate="no" aria-hidden="true">close</span>
    </button>
  </div>
  <dl id="response-details" class="response-details"></dl>
</dialog>
