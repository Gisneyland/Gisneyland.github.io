<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      transition: background-color 0.5s ease, color 0.5s ease;
    }
    body.light-mode {
      background-color: #f9f9f9;
      color: #333;
    }
    body.dark-mode {
      background-color: #121212;
      color: #f1f1f1;
    }
    body.auto-mode {
      background-color: #f9f9f9;
      color: #333;
    }
    @media (prefers-color-scheme: dark) {
      body.auto-mode {
        background-color: #121212;
        color: #f1f1f1;
      }
    }

    header {
      background: linear-gradient(to right, #e40303, #ff8c00, #ffed00, #008026, #004dff, #750787);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
    }
    nav ul li {
      margin-right: 20px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      font-weight: bold;
    }
    nav ul li a:hover {
      background-color: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
    .tools {
      position: absolute;
      right: 20px;
      top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select.mode-toggle {
      background-color: #555;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body class="auto-mode">
  <header>
    <nav>
      <ul>
        <li><a href="/">風城部屋</a></li>
        <li><a href="/rainbow/">新竹彩虹文化祭</a></li>
        <li><a href="/HIVA/">愛滋篩檢</a></li>
        <li><a href="/syphilis/">梅毒篩檢</a></li>
      </ul>
    </nav>
    <div class="tools">
      <!-- Google Translate Widget 固定在右上角 -->
      <div id="google_translate_element"></div>
      <!-- 三種模式切換選單（含圖示） -->
      <select class="mode-toggle" onchange="setMode(this.value)">
        <option value="auto">⚙️ 自動</option>
        <option value="light">🌞 明亮</option>
        <option value="dark">🌙 暗黑</option>
      </select>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <!-- Google Translate Script -->
<div id="google_translate_element"></div>
<div id="translate_fallback" style="display:none; color:white; background-color:#555; padding:6px 10px; border-radius:4px;">
  ⚠️ 翻譯工具載入失敗，請檢查瀏覽器設定或停用廣告阻擋器。
</div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: 'zh-TW',
        includedLanguages: 'id,th,vi,my,tl,km,bn,en,zh-TW',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      },
      'google_translate_element'
    );
  }

  // fallback 檢查：如果 5 秒後翻譯工具還沒載入，就顯示提示
  setTimeout(function() {
    var el = document.getElementById('google_translate_element');
    if (!el.innerHTML || el.innerHTML.trim() === "") {
      document.getElementById('translate_fallback').style.display = "inline-block";
    }
  }, 5000);
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


  <!-- 模式切換 Script -->
  <script>
    function setMode(mode) {
      document.body.classList.remove('auto-mode', 'light-mode', 'dark-mode');
      if (mode === 'auto') {
        document.body.classList.add('auto-mode');
      } else if (mode === 'light') {
        document.body.classList.add('light-mode');
      } else if (mode === 'dark') {
        document.body.classList.add('dark-mode');
      }
      localStorage.setItem('site-mode', mode);
    }

    window.onload = function() {
      const savedMode = localStorage.getItem('site-mode') || 'auto';
      document.querySelector('.mode-toggle').value = savedMode;
      setMode(savedMode);
    }
  </script>
</body>
</html>
