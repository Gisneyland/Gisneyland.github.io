<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      color: #2c3e50;
    }
    nav {
      background-color: #3498db;
      padding: 10px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav ul li {
      position: relative;
      margin-right: 20px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      display: block;
    }
    nav ul li a:hover {
      background-color: #2980b9;
      border-radius: 4px;
    }
    nav ul li ul {
      display: none;
      position: absolute;
      top: 35px;
      left: 0;
      background-color: #3498db;
      padding: 0;
      list-style: none;
    }
    nav ul li:hover ul {
      display: block;
    }
    nav ul li ul li {
      margin: 0;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    label {
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #3498db;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ page.title }}</h1>
    <nav>
      <ul>
        <li><a href="/">風城部屋</a></li>
        <li><a href="/rainbow/">新竹彩虹文化祭</a></li>
        <li>
          <a href="#">快速篩檢</a>
          <ul>
            <li><a href="/hiva/">愛滋</a></li>
            <li><a href="/syphilis/">梅毒</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
