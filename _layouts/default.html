<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #3498db;
      padding: 10px 20px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav ul li {
      position: relative;
      margin-right: 20px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      display: block;
    }
    nav ul li a:hover {
      background-color: #2980b9;
      border-radius: 4px;
    }
    nav ul li ul {
      display: none;
      position: absolute;
      top: 35px;
      left: 0;
      background-color: #3498db;
      padding: 0;
      list-style: none;
      min-width: 120px;
    }
    nav ul li:hover ul {
      display: block;
    }
    nav ul li ul li {
      margin: 0;
    }
    main {
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="/">風城部屋</a></li>
        <li><a href="/rainbow/">新竹彩虹文化祭</a></li>
        <li>
          <a href="#">快速篩檢</a>
          <ul>
            <li><a href="/HIVA/">愛滋</a></li>
            <li><a href="/syphilis/">梅毒</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
