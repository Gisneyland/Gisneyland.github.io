name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jekyll-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify CDN integrity hashes
        run: node scripts/check-cdn-integrity.cjs
      - name: Run unit tests
        run: node --test tests/*.test.cjs
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '3.3'
      - name: Build Jekyll site
        run: bundle exec jekyll build

  supabase-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta
      - name: Apply schema and migrations
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $file"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Check RLS for batch import and delete
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f tests/supabase/response-batch.sql
      - name: Check security advisor migration
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f tests/supabase/security-advisor.sql
